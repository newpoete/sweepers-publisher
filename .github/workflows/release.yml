name: Release

# Releases the queue for today's date (UTC) and deploys the site to GitHub Pages.
# See the README ("Daily release") for running it by hand and checking the last run.

on:
  schedule:
    # Just after 00:00 UTC. Off the top of the hour, when GitHub's schedules are
    # busiest and most often late.
    - cron: '7 0 * * *'
  push:
    branches: [main]
  # No date input on purpose: releasing a later date would publish tomorrow's leaf.
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; a newer one waits rather than cancelling a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The fixture queue until Epic 3, when the editor starts publishing to data/queue.
  QUEUE_DIR: spec/fixtures/queue

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The publisher uses only Ruby's standard library, so no bundle install.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The key goes to bin/release through the environment only. GitHub masks
      # secrets in logs, and bin/release never prints it. The decrypted queue
      # stays in memory; only the released site is written, to $RUNNER_TEMP.
      - name: Release
        env:
          AGE_SECRET_KEY: ${{ secrets.AGE_SECRET_KEY }}
        run: |
          if [ -z "$AGE_SECRET_KEY" ]; then
            echo "::error::The AGE_SECRET_KEY Actions secret is not set."
            exit 1
          fi
          bin/release "$QUEUE_DIR" "$RUNNER_TEMP/site"
      # Only reached when the release succeeded, so a failed or partial release is
      # never deployed: the previous deploy stays up.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # GitHub disables schedules in a public repo after 60 days with no activity.
  # When the last commit is 50 days old, this adds an empty commit to main.
  # While the editor publishes (Epic 3), its commits keep the repo active and
  # this does nothing. See the README ("Keep-alive").
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Commit if the repo has been quiet for 50 days
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit: $days days ago."
          if [ "$days" -lt 50 ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "Keep the daily release schedule alive ($days days without a commit)"
          git push
