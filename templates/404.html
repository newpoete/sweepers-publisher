<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Page Not Found</title>

    <!-- GitHub Pages serves this page for a missing path at any depth, so the
         relative links below resolve from the site root. The release fills in
         the root's path from --base-url (see docs/data-contract.md). -->
    <base href="{{base_path}}/">

    <!-- Bootstrap 3.3.4, as on the original site -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css" integrity="sha384-604wwakM23pEysLJAhja8Lm42IIwYrJ0dEAqzFsj9pJ/P5buiujjywArgPCi8eoz" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/stylesheets/bootstrap.css">
    <link rel="stylesheet" href="assets/stylesheets/sweepers.css">

    <!-- Fonts. No integrity hash: Google varies this CSS by browser, so it has no fixed hash -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IM+Fell+DW+Pica">

    <!-- Favicon -->
    <link rel="icon" type="image/vnd.microsoft.icon" href="favicon.ico?v=20151219">
    <link rel="shortcut icon" href="favicon.ico?v=20151219">
  </head>

  <body data-page="not-found" data-root=".">
    <!-- layout:navbar -->
    <nav class="navbar navbar-default" role="navigation">
      <div class="container">
        <div class="navbar-header">
          <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#navbar-brand-centered">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>

          <div class="navbar-brand navbar-brand-centered">
            <a href="./">The Sweepers Calendar</a>
          </div>
        </div>

        <div class="collapse navbar-collapse" id="navbar-brand-centered">
          <ul class="nav navbar-nav">
            <li class="inactive"><a href="today">Today</a></li>
            <li class="inactive"><a href="yesterday">Yesterday</a></li>
            <li class="inactive"><a href="selections">Selections</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- /layout:navbar -->

    <div class="container">
      <h2>404</h2>

      <p id="not-found">Page not found.</p>
    </div>

    <!-- layout:footer -->
    <footer class="footer">
      <div class="container">
        <div class="row">
          <div class="col-md-3">
            <p class="pull-left"><span class="livestamp"></span></p>
          </div>

          <div class="col-md-6">
            <p class="center">Some rights reserved, <span class="copyright-year">2026</span></p>
          </div>

          <div class="col-md-3">
            <p class="pull-right">
              <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">
                <img alt="Creative Commons License" style="border-width:0"
                     src="https://i.creativecommons.org/l/by-nc-sa/4.0/80x15.png">
              </a>
            </p>
          </div>
        </div>
      </div>
    </footer>
    <!-- /layout:footer -->

    <!-- jQuery and Bootstrap 3.3.4 (the navbar collapse needs them), as on the original site -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js" integrity="sha384-Pn+PczAsODRZ2PiGg0IheRROpP7lXO1NTIjiPo6cca8TliBvaeil42fobhzvZd74" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/js/bootstrap.min.js" integrity="sha384-EKxMxgJ+EnnZ5yB3ygGPe1lXaPvlAzKFXU+wW7kO9Bn9ZCgFRrc3wWtCnsDHbemf" crossorigin="anonymous"></script>
    <script src="assets/javascripts/calendar.js"></script>
    <script src="assets/javascripts/pages.js"></script>
    <!-- GoatCounter (sweepers-editor#107): counts page views on sweeperscalendar.com only, with no cookies -->
    <script>if (window.location.hostname !== 'sweeperscalendar.com') window.goatcounter = {no_onload: true};</script>
    <script data-goatcounter="https://sweeperscalendar.goatcounter.com/count" async src="https://gc.zgo.at/count.v5.js" integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ" crossorigin="anonymous"></script>
  </body>
</html>
